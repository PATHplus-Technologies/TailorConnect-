

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tailorconnect
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
    volumes:
      - ./media:/app/media
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/tailorconnect
      - DEBUG=True
      - SECRET_KEY=your-production-secret-key-here
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./tailorconnect-frontend
      dockerfile: Dockerfile.frontend
      network: default
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
